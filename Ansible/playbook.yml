---
- name: Deploy and Configure Azure VM with Docker and ACR
  hosts: azure_vms
  become: true

  vars:
    network_name: "my-app-network"
    acr_name: "healthsyncacr"
    services:
      - { name: "db-service", port: 5000 }
      - { name: "authentication-service", port: 4000 }
      - { name: "admin-service", port: 4001 }
      - { name: "user-service", port: 4002 }
      - { name: "doctor-service", port: 4003 }
      - { name: "frontend", port: 80 }

  tasks:
    - name: Install required dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - lsb-release
          - gnupg
          - docker.io
          - dnsutils
        state: present
        update_cache: yes

    - name: Install Azure CLI
      shell: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      args:
        creates: /usr/bin/az

    - name: Login to Azure using managed identity
      command: az login --identity

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to Docker group (if not already added)
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      notify: Reboot system if user group changed

    - name: Flush handlers to trigger reboot if needed
      meta: flush_handlers

    - name: Wait for host to come back online after reboot
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Ensure Docker is running after reboot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network (after reboot)
      docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Login to Azure Container Registry (ACR)
      command: az acr login --name "{{ acr_name }}"

    - name: Pull all required Docker images from ACR
      docker_image:
        name: "{{ acr_name }}.azurecr.io/{{ item.name }}:latest"
        source: pull
      loop: "{{ services }}"

    - name: Get public IP of Azure VM
      shell: dig +short myip.opendns.com @resolver1.opendns.com
      register: public_ip
      changed_when: false

    - name: Run Docker containers for services
      docker_container:
        name: "{{ item.name }}"
        image: "{{ acr_name }}.azurecr.io/{{ item.name }}:latest"
        network_mode: "{{ network_name }}"
        state: started
        published_ports:
          - "{{ item.port }}:{{ item.port }}"
      loop: "{{ services }}"

    - name: Verify running Docker containers
      command: docker ps

  handlers:
    - name: Reboot system if user group changed
      reboot:
        msg: "Rebooting after adding user to Docker group"
        reboot_timeout: 300