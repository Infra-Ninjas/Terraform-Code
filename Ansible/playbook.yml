---
- name: Deploy and Configure Azure VM with Docker and ACR
  hosts: azure_vms
  become: true

  vars:
    network_name: "my-app-network"
    acr_name: "rupeshcapstoneacr"
    mongodb_service_image: "{{ acr_name }}.azurecr.io/mongodb-service:latest"
    mongodb_service_host_port: "5000"
    mongodb_service_container_port: "5000"
    auth_service_image: "{{ acr_name }}.azurecr.io/auth-service:latest"
    auth_service_host_port: "4000"
    auth_service_container_port: "4000"
    frontend_image: "{{ acr_name }}.azurecr.io/frontend:latest"
    frontend_host_port: "8000"
    frontend_container_port: "80"

  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install required dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - lsb-release
          - gnupg
          - docker.io
        state: present

    - name: Install Azure CLI
      shell: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      args:
        creates: /usr/bin/az

    - name: Verify Azure CLI installation
      command: az --version

    - name: Login to Azure using managed identity
      command: az login --identity

    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Verify Docker installation
      command: docker --version

    - name: Add user to Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reboot system to apply group changes
      reboot:
        msg: "Rebooting after adding user to Docker group"
        reboot_timeout: 600

    - name: Wait for host to come back online
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Ensure Docker is running after reboot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network for the application
      docker_network:
        name: "{{ network_name }}"
        state: present

    - name: Login to Azure Container Registry (ACR)
      command: az acr login --name "{{ acr_name }}"

    - name: Pull Frontend Docker image from ACR
      docker_image:
        name: "{{ frontend_image }}"
        source: pull
    
    - name: Pull Auth Service Docker image from ACR
      docker_image:
        name: "{{ auth_service_image }}"
        source: pull

    - name: Pull MongoDB Service Docker image from ACR
      docker_image:
        name: "{{ mongodb_service_image }}"
        source: pull

    - name: List Docker images
      command: docker images

    - name: Run Docker container for the MongoDB Service
      docker_container:
        name: mongodb-service-container
        image: "{{ mongodb_service_image }}"
        network_mode: "{{ network_name }}"
        state: started
        published_ports:
          - "{{ mongodb_service_host_port }}:{{ mongodb_service_container_port }}"
    
    - name: Run Docker container for the Auth Service
      docker_container:
        name: auth-service-container
        image: "{{ auth_service_image }}"
        network_mode: "{{ network_name }}"
        state: started
        published_ports:
          - "{{ auth_service_host_port }}:{{ auth_service_container_port }}"

    - name: Run Docker container for the Frontend
      docker_container:
        name: frontend-container
        image: "{{ frontend_image }}"
        network_mode: "{{ network_name }}"
        state: started
        published_ports:
          - "{{ frontend_host_port }}:{{ frontend_container_port }}"

    - name: Verify running Docker containers
      command: docker ps
